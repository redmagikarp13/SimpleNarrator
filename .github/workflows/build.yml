name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Windows)
        run: choco install ffmpeg -y

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: pyinstaller main.spec

      - name: Rename Single Executable
        run: Move-Item dist/SimpleNarrator.exe SimpleNarrator-Windows.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNarrator-Windows.exe
          path: SimpleNarrator-Windows.exe

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libespeak-ng1 flatpak flatpak-builder

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Linux Executable
        run: pyinstaller main.spec

      - name: Compress Tarball
        run: tar -czvf SimpleNarrator-Linux.tar.gz -C dist SimpleNarrator

      - name: Prepare Flatpak Binary
        run: |
          mkdir -p flatpak-bin
          cp dist/SimpleNarrator flatpak-bin/SimpleNarrator
          cp com.github.redmagikarp13.SimpleNarrator.desktop flatpak-bin/com.github.redmagikarp13.SimpleNarrator.desktop

      - name: Build Flatpak Package
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
          flatpak-builder --user --disable-rofiles-fuse --repo=repo-dir build-dir com.github.redmagikarp13.SimpleNarrator.yml --force-clean
          flatpak build-bundle repo-dir SimpleNarrator-Linux.flatpak com.github.redmagikarp13.SimpleNarrator

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNarrator-Linux.tar.gz
          path: SimpleNarrator-Linux.tar.gz

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNarrator-Linux.flatpak
          path: SimpleNarrator-Linux.flatpak

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (macOS)
        run: |
          brew install ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS Executable
        run: pyinstaller main.spec

      - name: Compress Build
        run: cd dist && zip -r ../SimpleNarrator-macOS.zip SimpleNarrator

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNarrator-macOS.zip
          path: SimpleNarrator-macOS.zip

  publish-release:
    needs: [build-windows, build-ubuntu, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SimpleNarrator-Windows.exe

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: SimpleNarrator-Linux.tar.gz

      - name: Download Linux Flatpak Artifact
        uses: actions/download-artifact@v4
        with:
          name: SimpleNarrator-Linux.flatpak

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: SimpleNarrator-macOS.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SimpleNarrator-Windows.exe
            SimpleNarrator-Linux.tar.gz
            SimpleNarrator-Linux.flatpak
            SimpleNarrator-macOS.zip
